services:
  - type: web
    name: butterfly-manager-api
    runtime: node
    buildCommand: cd apps/server && yarn install && yarn deploy
    startCommand: cd apps/server && yarn start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false
